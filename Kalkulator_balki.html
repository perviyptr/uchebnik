	<p class="zagolovok">Калькулятор балок<p>
	    <div class="input-group">
        <label>Тип опор:</label>
        <select id="supportType">ыыы
            <option value="simply-supported">Шарнирная</option>
            <option value="fixed">Заделка</option>
            <option value="cantilever">Консоль</option>
        </select>
    </div>

    <div class="input-group">
        <label>Тип нагрузки:</label>
        <select id="loadType">
            <option value="concentrated">Сосредоточенная</option>
            <option value="distributed">Распределённая</option>
        </select>
    </div>

    <div class="input-group">
        <label>Нагрузка:</label>
        <input type="number" id="load" step="any" required>

    </div>

    <div class="input-group">
        <label>Длина балки (м):</label>
        <input type="number" id="length" step="any" required>
    </div>

    <div class="input-group">
        <label>Сортамент балки:</label>
        <select id="sectionType">

            <option value="rectangle">Прямоугольник (пиломатериал)</option>
            <option value="square_tube">Труба квадратная</option>
            <option value="rect_tube">Труба прямоугольная</option>
            <option value="angle">Уголок</option>
            <option value="channel">Швеллер</option>
            <option value="I-beam">Двутавр</option>
        </select>
    </div>

    <div class="input-group">
        <label>Материал:</label>
        <select id="material">
            <option value="steel">Сталь (σ=245 МПа)</option>
            <option value="wood">Дерево (σ=10 МПа)</option>
        </select>
    </div>

    <div class="input-group">
        <label>Коэффициент запаса прочности:</label>
        <input type="number" id="safetyFactor" value="1.5" step="0.1" min="1.1" required>
        <div class="note">Рекомендуемые значения: 1.5-2.5</div>
    </div>

    <div class="input-group">
        <label>Расстояние до точки приложения силы (м):</label>
        <input type="number" id="distance" step="any" required>
        <div class="note">Для консоли - расстояние от заделки</div>
    </div>

    <button onclick="calculate()">Выполнить расчёт</button>
    <div id="result"></div>

// Основные расчетные функции
function calculate() {
    if (!validateInputs()) return;

    // Получение входных данных
    const inputs = getInputValues();
    const M = calculateBendingMoment(inputs);
    const sigma_allow = getAllowableStress(inputs.material, inputs.safetyFactor);
    const W_required = M / sigma_allow;

    // Подбор профиля
    const profiles = getProfiles(inputs.sectionType);
    const selectedProfile = profiles.find(p => p.Wx >= W_required || p.W >= W_required);

    // Вывод результатов
    displayResults(selectedProfile, W_required, inputs);
}

// Вспомогательные функции
function validateInputs() {
    const required = ['load', 'length', 'safetyFactor', 'distance'];
    return required.every(id => {
        const el = document.getElementById(id);
        if (!el.value || isNaN(el.value)) {
            alert(`Поле "${el.previousElementSibling.textContent.trim()}" заполнено неверно`);
            return false;
        }
        return true;
    });
}

function getInputValues() {
    return {
        supportType: document.getElementById('supportType').value,
        loadType: document.getElementById('loadType').value,
        loadValue: parseFloat(document.getElementById('load').value),
        length: parseFloat(document.getElementById('length').value),
        sectionType: document.getElementById('sectionType').value,
        material: document.getElementById('material').value,
        safetyFactor: parseFloat(document.getElementById('safetyFactor').value),
        distance: parseFloat(document.getElementById('distance').value)
    };
}

function calculateBendingMoment(inputs) {
    const L = inputs.length * 1000; // в мм
    const a = inputs.distance * 1000; // в мм

    let M = 0;
    const P = inputs.loadValue * 9.81; // в Н
    const q = (inputs.loadValue * 9.81) / 1000; // Н/мм

    switch(inputs.supportType) {
        case 'simply-supported':
            M = inputs.loadType === 'concentrated'
                ? (P * a * (L - a)) / L
                : (q * L**2) / 8;
            break;
        case 'fixed':
            if(inputs.loadType === 'concentrated') {
                const b = L - a;
                M = Math.max((P * a * b**2)/L**2, (P * a**2 * b)/L**2);
            } else {
                M = (q * L**2) / 12;
            }
            break;
        case 'cantilever':
            M = inputs.loadType === 'concentrated'
                ? P * a
                : (q * L**2) / 2;
            break;
    }
    return M;
}

function getAllowableStress(material, safetyFactor) {
    const baseStress = material === 'steel' ? 245 : 10; // в МПа (Н/мм²)
    return baseStress / safetyFactor;
}

function getProfiles(type) {
    const standard = profileData.standard[type] || [];
    const parametric = type === 'circle' || type === 'square'
        ? profileData.parametric[type].sizes.map(size => ({
            name: `${type === 'circle' ? 'Круг' : 'Квадрат'} ${size}мм`,
            W: Math.round(profileData.parametric[type].formula(size))
        }))
        : [];

    return [...standard, ...parametric].sort((a,b) =>
        (a.Wx || a.W) - (b.Wx || b.W)
    );
}

function displayResults(profile, W_req, inputs) {
    const resultDiv = document.getElementById('result');
    if (!profile) {
        resultDiv.innerHTML = `<div style="color: #dc3545;">Требуется профиль с W ≥ ${W_req.toFixed(0)} мм³</div>`;
        return;
    }

    const profileInfo = getProfileInfo(profile, inputs.sectionType);
    resultDiv.innerHTML = `
        <div style="font-size: 1.1em; margin-bottom: 15px;">
            <strong>Рекомендуемый профиль:</strong> ${profile.name}


        <div style="color: #28a745;">
            <strong>Требуемое значение момента сопротивления:</strong> ${W_req.toFixed(0)} мм³
        </div>

        <hr style="margin: 15px 0;">

        <div style="font-size: 0.9em; color: #6c757d;">
            Параметры расчета:
            <ul>
                <li>Материал: ${inputs.material === 'steel' ? 'Сталь' : 'Дерево'}</li>
                <li>Коэффициент запаса: ${inputs.safetyFactor}</li>
                <li>Тип опор: ${document.getElementById('supportType').selectedOptions[0].text}</li>
                <li>Тип нагрузки: ${document.getElementById('loadType').selectedOptions[0].text}</li>
                <li>Для всех профилей расчёт производится при нагружении вдоль длинной сторон</li>
            </ul>
        </div>
    `;
}

function getProfileInfo(profile, type) {
    switch(type) {
        case 'I-beam': return {
            dimensions: `h=${profile.h}мм, b=${profile.b}мм, t=${profile.t}мм`,
            W: profile.Wx
        };
        case 'channel': return {
            dimensions: `h=${profile.h}мм, b=${profile.b}мм, t=${profile.t}мм`,
            W: profile.Wx
        };
        case 'square_tube': return {
            dimensions: `${profile.B}x${profile.B}x${profile.t}мм`,
            W: profile.W
        };
        case 'rect_tube': return {
            dimensions: `${profile.B}x${profile.H}x${profile.t}мм`,
            W: profile.W
        };
        default: return {
            W: profile.Wx || profile.W
        };
    }
}
